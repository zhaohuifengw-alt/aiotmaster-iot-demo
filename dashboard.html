document.title = S.name + " · 鸿甯智能 IoT 演示中心";
document.getElementById("title").textContent = S.name;

const kpiBox = document.getElementById("kpis");
S.kpis.forEach(k => {
  const d = document.createElement("div");
  d.className = "kpi";
  d.innerHTML = `<div class="label">${k.label}</div><div class="val" ${k.id ? `id="${k.id}"` : ""}>${k.val.toLocaleString()}<small> ${k.unit}</small></div><div class="trend ${k.cls}">${k.trend}</div>`;
  kpiBox.appendChild(d);
});

function drawChart(id, data, color) {
  const c = document.getElementById(id), ctx = c.getContext("2d");
  const w = c.clientWidth, h = 180, dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr; ctx.scale(dpr, dpr);
  const max = Math.max(...data) * 1.15, min = Math.min(...data) * 0.85, pad = 8;
  ctx.strokeStyle = "#1c3358"; ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) { const y = h * i / 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  data.forEach((v, i) => {
    const x = pad + i * (w - pad * 2) / (data.length - 1);
    const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = color + "33"; ctx.lineTo(w - pad, h); ctx.lineTo(pad, h); ctx.closePath(); ctx.fill();
}
document.getElementById("chart1Title").textContent = S.c1;
document.getElementById("chart2Title").textContent = S.c2;
function renderCharts() { drawChart("chart1", S.d1, "#22d3ee"); drawChart("chart2", S.d2, "#fbbf24"); }

window.addEventListener("resize", renderCharts);

document.getElementById("alerts").innerHTML = S.alerts.map(a =>
  `<div class="alert"><span class="tag ${a[0] === "red" ? "red" : a[0] === "yellow" ? "yellow" : "blue"}">${a[1]}</span><span>${a[2]}</span></div>`).join("");
document.getElementById("devices").innerHTML = "<tr><th>设备</th><th>状态</th></tr>" + S.devices.map(d =>
  `<tr><td>${d[0]}</td><td><span class="dot ${d[2]}"></span>${d[1]}</td></tr>`).join("");

  document.getElementById("lightPanel").style.display = "grid";
  const lampsBox = document.getElementById("lamps");
  const lamps = Array.from({ length: 12 }, (_, i) => ({ name: "中山路 " + (101 + i) + " 号", on: i !== 3 && i !== 7 }));
  function renderLamps() {
    const onCount = lamps.filter(l => l.on).length;
    const rate = (99.4 - (12 - onCount) * 0.05).toFixed(1);
    const el = document.getElementById("litRate");
    if (el) el.innerHTML = rate + "<small> %</small>";
    lampsBox.innerHTML = lamps.map((l, i) =>
      `<div class="lamp ${l.on ? "on" : ""}" data-i="${i}"><div class="bulb">💡</div><div class="name">${l.name}</div><div class="state">${l.on ? "已点亮" : "已关闭"}</div></div>`).join("");
    lampsBox.querySelectorAll(".lamp").forEach(el => el.onclick = () => { lamps[+el.dataset.i].on = !lamps[+el.dataset.i].on; renderLamps(); });
  }
  renderLamps();
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleString("zh-CN", { hour12: false });
  const firstVal = document.querySelector(".kpi .val");
  if (firstVal && !firstVal.id) {
    const base = parseFloat(firstVal.textContent.replace(/,/g, ""));
    if (!isNaN(base)) firstVal.innerHTML = Math.round(base * (0.995 + Math.random() * 0.01)).toLocaleString() + "<small> " + S.kpis[0].unit + "</small>";
  }
}
tick(); setInterval(tick, 3000);
