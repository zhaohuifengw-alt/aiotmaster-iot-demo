const scene = new URLSearchParams(location.search).get("scene") || "water";
const S = SCENES[scene] || SCENES.water;
document.title = S.name + " · 鸿甯智能 IoT 演示中心";
document.getElementById("title").textContent = S.name;
document.getElementById("mapTitle").textContent = S.mapTitle + " · 点节点查看详情";

function fmt(v) { return typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString() : v) : v; }
function statusText(n) {
  if (n.canToggle && n.on === false) return "已停止";
  return n.status === "ok" ? "正常" : n.status === "warn" ? "告警" : "故障";
}
function statusCls(n) {
  if (n.canToggle && n.on === false) return "off";
  return n.status === "ok" ? "ok" : n.status === "warn" ? "warn" : "bad";
}
function nodeXY(n) {
  if (n.kind === "ship") {
    const r = S.routes[n.route];
    const pts = r.pts;
    let total = 0;
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      segs.push(len); total += len;
    }
    let d = n.pos * total;
    for (let i = 0; i < segs.length; i++) {
      if (d <= segs[i]) {
        const t = segs[i] ? d / segs[i] : 0;
        return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t];
      }
      d -= segs[i];
    }
    return pts[pts.length - 1];
  }
  return [n.x, n.y];
}

let selId = S.nodes[0].id;
const nodeById = id => S.nodes.find(n => n.id === id);

function renderMap() {
  const wrap = document.getElementById("mapWrap");
  let inner = "";
  if (S.routes) {
    S.routes.forEach(r => {
      inner += `<polyline points="${r.pts.map(p => p.join(",")).join(" ")}" class="route" /><text x="${(r.pts[0][0] + r.pts[r.pts.length - 1][0]) / 2}" y="${Math.min(...r.pts.map(p => p[1])) - 2}" class="route-label">${r.name}</text>`;
    });
  }
  if (S.links) {
    S.links.forEach(l => { inner += `<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" class="link" />`; });
  }
  S.nodes.forEach(n => {
    const [x, y] = nodeXY(n);
    const cls = statusCls(n);
    const icon = n.kind === "ship" ? "🚢" : n.kind === "port" ? "⚓" : "";
    inner += `<g class="map-node ${n.id === selId ? "sel" : ""}" data-id="${n.id}">
      <circle cx="${x}" cy="${y}" r="3.2" class="dot-${cls}" />
      <text x="${x}" y="${y - 5}" class="node-label">${icon ? icon + " " : ""}${n.name}</text></g>`;
  });
  wrap.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
  wrap.querySelectorAll(".map-node").forEach(g => g.addEventListener("click", () => { selId = g.dataset.id; renderMap(); renderDetail(); }));
}

function renderDetail() {
  const n = nodeById(selId);
  const d = document.getElementById("detail");
  let html = `<div class="detail-head"><b>${n.name}</b><span class="tag ${n.status === "ok" ? "blue" : n.status === "warn" ? "yellow" : "red"}">${statusText(n)}</span></div>`;
  html += `<table class="tele">${n.tele.map((t, i) => `<tr><td>${t.l}</td><td><span class="tele-val" data-i="${i}">${fmt(t.v)}</span>${t.u ? " " + t.u : ""}</td></tr>`).join("")}</table>`;
  html += `<div class="ctl-row">`;
  if (n.canToggle) html += `<button class="btn small" onclick="toggleNode()">${n.on ? "停止运行" : "启动运行"}</button>`;
  if (n.modes) html += `<button class="btn small ghost" onclick="cycleMode()">模式：${n.modes[n.mode]} ▾</button>`;
  if (n.status === "warn" || n.status === "fault") html += `<button class="btn small" onclick="fixNode()">派单处置</button>`;
  if (n.kind === "ship") {
    html += `<label class="slider-label">设定航速 <span id="knVal">${n.kn}</span> kn</label>
      <input type="range" min="8" max="16" step="0.1" value="${n.kn}" oninput="setKn(this.value)">
      <div class="route-btns">${S.routes.map((r, i) => `<button class="btn small ${n.route === i ? "" : "ghost"}" onclick="setRoute(${i})">${r.name}</button>`).join("")}</div>`;
  }
  html += `</div>`;
  d.innerHTML = html;
}
function toggleNode() {
  const n = nodeById(selId);
  n.on = !n.on;
  pushAlert("blue", "设备操作", `${n.name}已${n.on ? "启动" : "停止"}运行 · 刚刚`);
  renderMap(); renderDetail(); renderTable();
}
function cycleMode() {
  const n = nodeById(selId);
  n.mode = (n.mode + 1) % n.modes.length;
  pushAlert("blue", "模式切换", `${n.name}切换为${n.modes[n.mode]}模式 · 刚刚`);
  renderDetail();
}
function fixNode() {
  const n = nodeById(selId);
  n.status = "ok";
  pushAlert("blue", "处置完成", `${n.name}已派单处置，恢复正常 · 刚刚`);
  renderMap(); renderDetail(); renderTable();
}
function setKn(v) {
  const n = nodeById(selId);
  n.kn = parseFloat(v);
  document.getElementById("knVal").textContent = n.kn;
  const t = n.tele.find(t => t.l === "航速");
  if (t) t.v = n.kn;
  renderTele();
}
function setRoute(i) {
  const n = nodeById(selId);
  n.route = i; n.pos = 0.05;
  pushAlert("blue", "航线调整", `${n.name}航线调整为${S.routes[i].name} · 刚刚`);
  renderMap(); renderDetail();
}
function renderTele() {
  const n = nodeById(selId);
  document.querySelectorAll(".tele-val").forEach(el => {
    const t = n.tele[+el.dataset.i];
    if (t) el.textContent = fmt(t.v);
  });
}

let activeStrat = 0;
function renderStrats() {
  const box = document.getElementById("strats");
  box.innerHTML = S.strategies.map((s, i) => `<button class="strat ${i === activeStrat ? "active" : ""}" data-i="${i}">${s.name}</button>`).join("");
  document.getElementById("stratNote").textContent = S.strategies[activeStrat].note;
  box.querySelectorAll(".strat").forEach(b => b.addEventListener("click", () => {
    activeStrat = +b.dataset.i;
    pushAlert("blue", "策略执行", `${S.strategies[activeStrat].name}策略已执行 · 刚刚`);
    renderStrats();
  }));
}

function renderAlerts() {
  document.getElementById("alerts").innerHTML = S.alerts.slice(0, 8).map(a =>
    `<div class="alert"><span class="tag ${a[0] === "red" ? "red" : a[0] === "yellow" ? "yellow" : "blue"}">${a[1]}</span><span>${a[2]}</span></div>`).join("");
}
function pushAlert(level, title, text) {
  S.alerts.unshift([level, title, text]);
  renderAlerts();
}
function renderTable() {
  document.getElementById("devices").innerHTML = "<tr><th>设备</th><th>状态</th></tr>" + S.nodes.map(n =>
    `<tr><td>${n.name}</td><td><span class="dot ${statusCls(n)}"></span>${statusText(n)}</td></tr>`).join("");
}

const kpiBox = document.getElementById("kpis");
S.kpis.forEach((k, i) => {
  const d = document.createElement("div");
  d.className = "kpi";
  d.innerHTML = `<div class="label">${k.label}</div><div class="val" ${i === 0 ? 'id="kpi0"' : ""}>${k.val.toLocaleString()}<small> ${k.unit}</small></div><div class="trend ${k.cls}">${k.trend}</div>`;
  kpiBox.appendChild(d);
});

function drawChart(id, data, color) {
  const c = document.getElementById(id), ctx = c.getContext("2d");
  const w = c.clientWidth, h = 180, dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr; ctx.scale(dpr, dpr);
  const max = Math.max(...data) * 1.15, min = Math.min(...data) * 0.85, pad = 8;
  ctx.strokeStyle = "#1c3358"; ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) { const y = h * i / 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  data.forEach((v, i) => {
    const x = pad + i * (w - pad * 2) / (data.length - 1);
    const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = color + "33"; ctx.lineTo(w - pad, h); ctx.lineTo(pad, h); ctx.closePath(); ctx.fill();
}
document.getElementById("chart1Title").textContent = S.c1;
document.getElementById("chart2Title").textContent = S.c2;
function renderCharts() { drawChart("chart1", S.d1, "#22d3ee"); drawChart("chart2", S.d2, "#fbbf24"); }
renderCharts();
window.addEventListener("resize", renderCharts);

function jitter(n) {
  n.tele.forEach(t => {
    if (typeof t.v === "number" && t.v !== 0) {
      const delta = t.v * (Math.random() * 0.04 - 0.02);
      t.v = Math.round((t.v + delta) * 100) / 100;
    }
  });
}
function tick() {
  document.getElementById("clock").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
  const kpi0 = document.getElementById("kpi0");
  if (kpi0) {
    const base = S.kpis[0].val;
    kpi0.innerHTML = Math.round(base * (0.995 + Math.random() * 0.01)).toLocaleString() + "<small> " + S.kpis[0].unit + "</small>";
  }
  S.nodes.forEach(n => { if (n.status === "ok" && (n.on !== false)) jitter(n); });
  S.nodes.forEach(n => {
    if (n.kind === "ship") { n.pos += n.kn * 0.0004; if (n.pos >= 1) n.pos = 0; }
  });
  if (Math.random() < 0.10) {
    const cands = S.nodes.filter(n => n.status === "ok" && n.on !== false && n.kind !== "port");
    if (cands.length) {
      const n = cands[Math.floor(Math.random() * cands.length)];
      n.status = Math.random() < 0.3 ? "fault" : "warn";
      pushAlert(n.status === "fault" ? "red" : "yellow", n.status === "fault" ? "设备故障" : "设备告警", `${n.name}出现${n.status === "fault" ? "故障" : "告警"}，请查看详情并处置 · 刚刚`);
    }
  }
  renderMap(); renderTele(); renderTable();
}
renderMap(); renderDetail(); renderStrats(); renderAlerts(); renderTable();
tick(); setInterval(tick, 3000);
