<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸿甯智能 · IoT 演示中心</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="logo"><span>鸿甯智能</span> · IoT 演示中心</div>
  <div class="sub">iot.aiotmaster.cn</div>
  <button class="topbtn" onclick="openReg()">企业申请</button>
</div>
<div class="wrap">
  <div class="hero">
    <h1>选一个场景，直接进入演示大屏</h1>
    <p>七个行业演示，开箱即看，数据为模拟生成。点卡片用演示账号登录，即进该场景的监控大屏；企业用户可提交入驻申请。</p>
  </div>
  <div class="demo-account">
    <span>通用演示账号</span>
    <span>账号 <code>demo@aiotmaster.cn</code></span>
    <span>密码 <code>demo123</code></span>
    <span>（已预填，点“进入演示”即可）</span>
  </div>
  <div class="grid" id="cards"></div>
  <div class="footer">
    演示数据为模拟数据，仅用于方案演示 · 鸿甯智能 GEO + AI 落地服务<br>
    <a href="https://aiotmaster.cn">返回 aiotmaster.cn 官网</a>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">进入演示</h3>
    <p id="modalDesc"></p>
    <label>演示账号</label>
    <input id="account" value="demo@aiotmaster.cn">
    <label>密码</label>
    <input id="password" type="password" value="demo123">
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="enterDemo()">进入演示</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="regBg">
  <div class="modal">
    <h3>企业入驻申请</h3>
    <p>填写以下信息提交申请，我们会在 1-2 个工作日内与您联系。</p>
    <label>企业名称</label>
    <input id="regCompany" placeholder="请填写企业全称">
    <label>联系人</label>
    <input id="regContact" placeholder="请填写联系人姓名">
    <label>联系电话</label>
    <input id="regPhone" placeholder="请填写手机号码" inputmode="tel">
    <p class="reg-note" id="regNote"></p>
    <div class="row">
      <button class="btn ghost" onclick="closeReg()">取消</button>
      <button class="btn" onclick="submitReg()">提交申请</button>
    </div>
  </div>
</div>

<script>
const SCENES = {
  water: { name: "智慧水务", icon: "💧", desc: "供水管网、水质、漏损全景监控：取水、供水、管网压力与水质合格率实时在线。", s1: ["128", "监测点"], s2: ["98.2%", "设备在线率"], modal: "供水管网演示：泵站、管网压力、水质指标与漏损告警。" },
  fire:  { name: "智慧消防", icon: "🔥", desc: "联网单位、烟感温感、消防水压与火警处置：告警分级推送，处置闭环可查。", s1: ["2,340", "探测器"], s2: ["99.1%", "设备在线率"], modal: "消防演示：烟感、温感、水压、水箱液位与火警工单。" },
  park:  { name: "智慧园区", icon: "🏢", desc: "楼宇能耗、停车、门禁、环境与安防一张屏：园区运行状态与节能趋势一目了然。", s1: ["56", "栋楼宇"], s2: ["96.8%", "设备在线率"], modal: "园区演示：能耗、停车占用、门禁通行与环境监测。" },
  light: { name: "智慧路灯", icon: "💡", desc: "区域地图完整版：点地图灯点调光、分组策略、能耗分析与实时告警一应俱全。", s1: ["3,860", "盏路灯"], s2: ["99.4%", "亮灯率"], modal: "路灯完整演示：区域地图、单灯控制、分组策略与能耗分析。" },
  farm: { name: "智慧农业", icon: "🌾", desc: "温室环境、灌溉阀门与土壤墒情：温度、湿度、节水一张屏。", s1: ["86", "座温室"], s2: ["97.5%", "设备在线率"], modal: "农业演示：温室环境、灌溉控制与墒情监测。" },
  community: { name: "智慧社区", icon: "🏘️", desc: "门禁通行、停车、物业工单与安防：小区运行状态实时在线。", s1: ["12", "个小区"], s2: ["98.6%", "设备在线率"], modal: "社区演示：门禁、停车、工单与安防监控。" },
  traffic: { name: "智慧交通", icon: "🚦", desc: "路口流量、信号配时与违停抓拍：路网运行与拥堵处置一屏可见。", s1: ["342", "个路口"], s2: ["99.0%", "信号在线率"], modal: "交通演示：路口流量、信号状态与违停抓拍。" }
};
let current = "water";
const grid = document.getElementById("cards");
Object.entries(SCENES).forEach(([key, s]) => {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="icon">${s.icon}</div><h3>${s.name}</h3><p>${s.desc}</p>
    <div class="stats"><div><b>${s.s1[0]}</b>${s.s1[1]}</div><div><b>${s.s2[0]}</b>${s.s2[1]}</div></div>
    <button class="btn">进入演示</button>`;
  d.onclick = () => openModal(key);
  grid.appendChild(d);
});
function openModal(key) {
  current = key;
  document.getElementById("modalTitle").textContent = "进入演示 · " + SCENES[key].name;
  document.getElementById("modalDesc").textContent = SCENES[key].modal;
  document.getElementById("modalBg").classList.add("open");
}
function closeModal() { document.getElementById("modalBg").classList.remove("open"); }
function enterDemo() { location.href = current === "light" ? "light/index.html" : "dashboard.html?scene=" + current; }
document.getElementById("modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeModal(); });
function openReg() { document.getElementById("regNote").textContent = ""; document.getElementById("regNote").className = "reg-note"; document.getElementById("regBg").classList.add("open"); }
function closeReg() { document.getElementById("regBg").classList.remove("open"); }
document.getElementById("regBg").addEventListener("click", e => { if (e.target.id === "regBg") closeReg(); });
function submitReg() {
  const company = document.getElementById("regCompany").value.trim();
  const contact = document.getElementById("regContact").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const note = document.getElementById("regNote");
  if (!company || !contact || !phone) { note.textContent = "请把企业名称、联系人、联系电话都填上。"; note.className = "reg-note err"; return; }
  if (phone.replace(/\D/g, "").length < 7) { note.textContent = "联系电话看起来不太对，请检查一下。"; note.className = "reg-note err"; return; }
  const subject = encodeURIComponent("IoT 平台入驻申请-" + company);
  const body = encodeURIComponent("企业名称：" + company + "\n联系人：" + contact + "\n联系电话：" + phone + "\n（来自 IoT 演示中心入驻申请）");
  location.href = "mailto:4643881@qq.com?subject=" + subject + "&body=" + body;
  note.textContent = "申请邮件已生成，请在邮箱中确认发送，我们会在 1-2 个工作日内联系您。";
  note.className = "reg-note ok";
}

</script>
</body>
</html>
