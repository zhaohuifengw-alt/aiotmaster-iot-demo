<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸿甯智能 · IoT 演示中心</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="logo"><span>鸿甯智能</span> · IoT 演示中心</div>
  <div class="sub">iot.aiotmaster.cn</div>
  <button class="topbtn" onclick="openReg()">企业申请</button>
</div>
<div class="wrap">
  <div class="hero">
    <h1>选一个场景，直接进入演示大屏</h1>
    <p>点击卡片，进入场景演示。</p>
  </div>

  <div class="grid" id="cards"></div>
  <div class="footer">
    鸿甯智能 · IoT 演示中心 · <a href="https://aiotmaster.cn">aiotmaster.cn</a>
  </div>
</div>

<div class="modal-bg" id="regBg">
  <div class="modal">
    <h3>企业入驻申请</h3>
    <p>填写以下信息提交申请，我们会在 1-2 个工作日内与您联系。</p>
    <label>企业名称</label>
    <input id="regCompany" placeholder="请填写企业全称">
    <label>联系人</label>
    <input id="regContact" placeholder="请填写联系人姓名">
    <label>联系电话</label>
    <input id="regPhone" placeholder="请填写手机号码" inputmode="tel">
    <p class="reg-note" id="regNote"></p>
    <div class="row">
      <button class="btn ghost" onclick="closeReg()">取消</button>
      <button class="btn" onclick="submitReg()">提交申请</button>
    </div>
  </div>
</div>

<script>
const SCENES = {
  water: { name: "智慧水务", icon: "💧", desc: "供水管网、水质、漏损全景监控", s1: ["128", "监测点"], s2: ["98.2%", "设备在线率"] },
  fire:  { name: "智慧消防", icon: "🔥", desc: "联网单位、烟感温感、火警处置闭环", s1: ["2,340", "探测器"], s2: ["99.1%", "设备在线率"] },
  park:  { name: "智慧园区", icon: "🏢", desc: "楼宇能耗、停车、门禁、安防一张屏", s1: ["56", "栋楼宇"], s2: ["96.8%", "设备在线率"] },
  light: { name: "智慧路灯", icon: "💡", desc: "区域地图完整版：单灯控制、分组策略、能耗分析", s1: ["3,860", "盏路灯"], s2: ["99.4%", "亮灯率"] },
  farm: { name: "智慧农业", icon: "🌾", desc: "温室环境、灌溉、土壤墒情一张屏", s1: ["86", "座温室"], s2: ["97.5%", "设备在线率"] },
  community: { name: "智慧社区", icon: "🏘️", desc: "门禁通行、停车、物业工单与安防", s1: ["12", "个小区"], s2: ["98.6%", "设备在线率"] },
  traffic: { name: "智慧交通", icon: "🚦", desc: "路口流量、信号配时、违停抓拍", s1: ["342", "个路口"], s2: ["99.0%", "信号在线率"] }
};
const grid = document.getElementById("cards");
Object.entries(SCENES).forEach(([key, s]) => {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="icon">${s.icon}</div><h3>${s.name}</h3><p>${s.desc}</p>
    <div class="stats"><div><b>${s.s1[0]}</b>${s.s1[1]}</div><div><b>${s.s2[0]}</b>${s.s2[1]}</div></div>
    <button class="btn">进入演示</button>`;
  d.onclick = () => { location.href = key === "light" ? "light/index.html" : "dashboard.html?scene=" + key; };
  grid.appendChild(d);
});

function openReg() { document.getElementById("regNote").textContent = ""; document.getElementById("regNote").className = "reg-note"; document.getElementById("regBg").classList.add("open"); }
function closeReg() { document.getElementById("regBg").classList.remove("open"); }
document.getElementById("regBg").addEventListener("click", e => { if (e.target.id === "regBg") closeReg(); });
function submitReg() {
  const company = document.getElementById("regCompany").value.trim();
  const contact = document.getElementById("regContact").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const note = document.getElementById("regNote");
  if (!company || !contact || !phone) { note.textContent = "请把企业名称、联系人、联系电话都填上。"; note.className = "reg-note err"; return; }
  if (phone.replace(/\D/g, "").length < 7) { note.textContent = "联系电话看起来不太对，请检查一下。"; note.className = "reg-note err"; return; }
  const subject = encodeURIComponent("IoT 平台入驻申请-" + company);
  const body = encodeURIComponent("企业名称：" + company + "\n联系人：" + contact + "\n联系电话：" + phone + "\n（来自 IoT 演示中心入驻申请）");
  location.href = "mailto:4643881@qq.com?subject=" + subject + "&body=" + body;
  note.textContent = "申请邮件已生成，请在邮箱中确认发送，我们会在 1-2 个工作日内联系您。";
  note.className = "reg-note ok";
}

</script>
</body>
</html>
